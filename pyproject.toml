[project]
name = "ripple"
version = "0.1.0"
description = "Rank public companies by their exposure to trends through a value-chain graph."
authors = [
    { name = "Kevin Fong", email = "kf53307@pausd.us" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[project.scripts]
ripple = "ripple.cli:app"
ripple-mcp = "ripple.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
