  reason: Alternators are generator-set components relevant to data-center backup
    power and lack a separate taxonomy entry.
  section: '1'
  start: 81390
  end: 81547
- id: new-8b2025719a
  label: Battery energy storage systems
  reason: Stationary batteries support distributed generation and energy management;
    they are not necessarily UPS systems.
  section: '1'
  start: 80869
  end: 81006
