# PRODUCES edges for the M22 products that no XBRL revenue line separates (docs/phase-2.md, D97).
# Three of these sit at confidence 0.3: the revenue is real but is reported inside a line that is
# already mapped to another product, so a propagating weight would count the same dollars twice
# (the D4 principle). They are stored as evidence and show up in `ripple explain`.

# --- Optical circuit switches: disclosed separately, so this one propagates ---------------

- src: company/lumentum
  rel: PRODUCES
  dst: product/optical-circuit-switches
  weight: 0.015
  weight_source: filing
  polarity: 1
  confidence: 0.9
  valid_from: 2025-12-27
  evidence:
    - url: https://www.sec.gov/Archives/edgar/data/1633978/000162828026005129/lite-20251227.htm
      note: "Lumentum's 10-Q puts initial OCS shipments above $10.0M in the quarter ended 2025-12-27; total net revenue that quarter was $665.5M, so 10.0/665.5 = 0.015."
      accessed: 2026-09-27
    - url: https://www.sec.gov/Archives/edgar/data/1633978/000162828026005005/lite_ex991xq2fy26.htm
      note: "Same quarter's results give the $665.5M denominator, and management puts OCS backlog well beyond $400M, so this share should rise fast."
      accessed: 2026-09-27

