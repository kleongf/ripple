# DRIVES edges for the Phase 2 themes (docs/phase-2.md, M23, D100).
# Volume theme: weight = share of the product's demand the theme drives. It may only drive nodes
# at the top of the chain (E10). Share_shift theme: weight = fraction of the node's demand that
# moves per unit shock (D8), and it needs one positive and one negative edge (E11).
# Demand buckets: minor 0.1, major 0.4, dominant 0.8.

